#@ load("@ytt:data", "data")
#@ load("@ytt:yaml", "yaml")
#@ repository = data.values.imagerepo + "/" + data.values.repositoryName 

---
#@ def config():

cloudProvider: #@ data.values.cloudProvider

storageClass:
  prefix: "yb-"
#@ end
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: yb-resources
  namespace: #@ data.values.namespace
spec:
  valuesFrom:
  - kind: ConfigMap
    name: cluster-yb-resources-helm-values
  interval: 5m
  chart:
    spec:
      chart: #@ data.values.repositoryName +"/"+ 'yb-resources'
      version: #@ data.values.yellowbrick.version
      sourceRef:
        kind: HelmRepository
        name: yb-repo
        namespace: flux-system
      interval: 1m
--- 
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-yb-resources-helm-values
  namespace: #@ data.values.namespace
data:
  values.yaml:  #@ yaml.encode(config())
    